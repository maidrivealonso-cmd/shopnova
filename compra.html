<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova - Compra realizada</title>

    <link rel="stylesheet" href="css/estilos.css">
    
</head>

<body>

<div class="app">

    <main class="compra-realizada">

        <!-- CONFIRMACIÓN -->

        <div class="check-compra">
            ✓
        </div>

        <h1>¡Compra realizada!</h1>

        <p class="mensaje-compra">
            Tu pedido fue realizado correctamente.
        </p>


        <!-- RESUMEN DEL PEDIDO -->

        <div class="resumen-compra">

            <h2>Resumen del pedido</h2>

            <div class="producto-compra">

                <div class="imagen-compra">

                    <img
                        src="img/camisa-blanca.jpg"
                        alt="Essential White Tee">

                </div>


                <div class="info-compra">

                    <h3>
                        Essential White Tee
                    </h3>

                    <p>
                        Talla: <strong>M</strong>
                    </p>

                    <p>
                        Color: <strong>Blanco</strong>
                    </p>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="total-compra">

                <span>
                    Total pagado
                </span>

                <strong>
                    $102.000
                </strong>

            </div>

        </div>


        <!-- NÚMERO DE PEDIDO -->

        <p class="numero-pedido">
            Número de pedido: <strong>#SN2026001</strong>
        </p>


        <!-- BOTONES -->

        <button
            class="boton-compra"
            onclick="window.location.href='index.html'">

            Volver al inicio

        </button>


        <button
            class="boton-secundario"
            onclick="window.location.href='perfil.html'">

            Consultar pedido

        </button>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
